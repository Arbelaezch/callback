# Include inside the host's server {} block (TLS and server_name stay on the host):
#
#   server {
#       listen 443 ssl;
#       server_name example.com;
#       include /path/to/callback/deploy/nginx/callback-proxy.conf;
#   }

# Real client IP from Cloudflare (adjust the path to where the repo lives).
include /path/to/callback/deploy/nginx/cloudflare-real-ip.conf;

location / {
    # nginx defaults to 1m. Must stay above RESUME_UPLOAD_MAX_BYTES and
    # COVER_LETTER_UPLOAD_MAX_BYTES (5 MB) in backend/callback/config.py,
    # plus multipart overhead.
    client_max_body_size 6m;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # X-Forwarded-For is deliberately OVERWRITTEN with the single real client
    # address, never appended ($proxy_add_x_forwarded_for must not be used).
    # Django trusts exactly one hop (NUM_PROXIES=1), so a client-supplied value
    # must never survive. See issue #23.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
